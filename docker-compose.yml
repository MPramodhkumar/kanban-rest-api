# Run the whole app:  docker compose --env-file docker.env up --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: taskzen
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Create docker.env first (see README)}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the tables the first time the database starts (empty volume only)
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d taskzen"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: pramodhkumar25/taskzen-api:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@db:5432/taskzen
      SECRET_KEY: ${SECRET_KEY:?Create docker.env first (see README)}
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    image: pramodhkumar25/taskzen-web:latest
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  pgdata:
